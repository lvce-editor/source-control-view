name: Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: 0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run build
      - uses: actions/checkout@v7
        with:
          repository: lvce-editor/lvce-editor
          ref: c18a4136e31170ec010d9edb31d9d4f28c9c3d46
          path: .tmp/lvce-integration
      - uses: actions/setup-node@v6
        with:
          node-version-file: .tmp/lvce-integration/.nvmrc
      - name: Install application dependencies
        working-directory: .tmp/lvce-integration
        run: npm ci
      - name: Install Chromium
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: npx playwright install --with-deps chromium
      - name: Prepare owned integration tests
        run: node packages/e2e-integration/prepare.mjs .tmp/lvce-integration
      - name: Run owned integration tests
        shell: bash
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: npm run e2e:headless --
      - name: Stage native source control regression
        run: node packages/e2e-integration/stage-native-source-control.mjs .tmp/lvce-integration
      - name: Stress native source control with published packages
        working-directory: .tmp/lvce-integration/packages/extension-host-worker-tests
        run: node ../../../../packages/e2e-integration/scripts/stress-native-source-control.mjs
        env:
          SOURCE_CONTROL_NATIVE_EVIDENCE_DIR: ${{ github.workspace }}/.tmp/source-control-native
      - name: Upload native source control evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-control-native-${{ matrix.os }}
          path: .tmp/source-control-native
          if-no-files-found: warn
      - name: Remove staged native source control regression
        if: always()
        run: node packages/e2e-integration/stage-native-source-control.mjs .tmp/lvce-integration --clean
